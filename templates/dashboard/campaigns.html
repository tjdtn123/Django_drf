{% extends "dashboard/base.html" %}
{% block title %}캠페인 목록 - Mini Ad Manager{% endblock %}
{% block nav_campaigns %}active{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0">캠페인 목록</h4>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">+ 캠페인 생성</button>
</div>

<!-- 상태 필터 -->
<div class="mb-3 d-flex gap-2" id="status-filter">
  <button class="btn btn-sm btn-dark active" data-status="">전체</button>
  <button class="btn btn-sm btn-outline-success" data-status="active">활성</button>
  <button class="btn btn-sm btn-outline-warning" data-status="paused">일시정지</button>
  <button class="btn btn-sm btn-outline-secondary" data-status="draft">초안</button>
  <button class="btn btn-sm btn-outline-dark" data-status="completed">완료</button>
</div>

<div class="card shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>캠페인명</th><th>상태</th><th>과금방식</th>
          <th>예산</th><th>기간</th><th>광고수</th><th>액션</th>
        </tr>
      </thead>
      <tbody id="campaign-list">
        <tr><td colspan="7" class="text-center py-4 text-muted">로딩 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 페이지네이션 -->
<nav class="mt-3" id="pagination"></nav>

<!-- 캠페인 생성 모달 -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">캠페인 생성</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="create-error" class="alert alert-danger d-none"></div>
        <form id="create-form" class="row g-3">
          <div class="col-12">
            <label class="form-label">캠페인명 *</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">총 예산 *</label>
            <input type="number" name="budget" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">일일 예산 *</label>
            <input type="number" name="daily_budget" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">과금 방식 *</label>
            <select name="billing_type" class="form-select">
              <option value="cpm">CPM</option>
              <option value="cpc">CPC</option>
              <option value="cpp">CPP</option>
              <option value="cpv">CPV</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">단가 *</label>
            <input type="number" name="unit_price" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">목표 노출수</label>
            <input type="number" name="target_impressions" class="form-control" value="0">
          </div>
          <div class="col-md-6">
            <label class="form-label">시작일 *</label>
            <input type="datetime-local" name="start_date" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">종료일 *</label>
            <input type="datetime-local" name="end_date" class="form-control" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-primary" onclick="createCampaign()">생성</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const STATUS_BADGE = {
    active: '<span class="badge bg-success">활성</span>',
    paused: '<span class="badge bg-warning text-dark">일시정지</span>',
    draft:  '<span class="badge bg-secondary">초안</span>',
    completed: '<span class="badge bg-dark">완료</span>',
  };

  let currentFilter = '';
  let nextUrl = null, prevUrl = null;

  async function loadCampaigns(url = null) {
    const params = currentFilter ? `?status=${currentFilter}` : '';
    const endpoint = url || `/campaigns/${params}`;
    const res = await apiFetch(endpoint.replace('/api/v1', ''));
    if (!res || !res.ok) return;
    const data = await res.json();

    nextUrl = data.next ? new URL(data.next).pathname + new URL(data.next).search : null;
    prevUrl = data.previous ? new URL(data.previous).pathname + new URL(data.previous).search : null;

    const tbody = document.getElementById('campaign-list');
    if (!data.results.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">캠페인 없음</td></tr>';
    } else {
      tbody.innerHTML = data.results.map(c => `
        <tr>
          <td><a href="/dashboard/campaigns/${c.id}/" class="text-decoration-none fw-semibold">${c.name}</a></td>
          <td>${STATUS_BADGE[c.status] || c.status}</td>
          <td><span class="badge bg-light text-dark border">${c.billing_type.toUpperCase()}</span></td>
          <td>₩${Number(c.budget).toLocaleString()}</td>
          <td class="small text-muted">${c.start_date.slice(0,10)} ~ ${c.end_date.slice(0,10)}</td>
          <td>${c.ad_count}</td>
          <td>
            ${c.status === 'active'
              ? `<button class="btn btn-sm btn-outline-warning" onclick="pauseCampaign(${c.id})">정지</button>`
              : `<button class="btn btn-sm btn-outline-success" onclick="activateCampaign(${c.id})">활성화</button>`
            }
          </td>
        </tr>
      `).join('');
    }

    // 페이지네이션
    document.getElementById('pagination').innerHTML = `
      <ul class="pagination pagination-sm">
        <li class="page-item ${!prevUrl ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="loadCampaigns('${prevUrl}')">이전</a>
        </li>
        <li class="page-item ${!nextUrl ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="loadCampaigns('${nextUrl}')">다음</a>
        </li>
      </ul>`;
  }

  async function activateCampaign(id) {
    await apiFetch(`/campaigns/${id}/activate/`, { method: 'POST' });
    loadCampaigns();
  }

  async function pauseCampaign(id) {
    await apiFetch(`/campaigns/${id}/pause/`, { method: 'POST' });
    loadCampaigns();
  }

  async function createCampaign() {
    const form = document.getElementById('create-form');
    const fd = new FormData(form);
    const body = Object.fromEntries(fd.entries());

    const res = await apiFetch('/campaigns/', {
      method: 'POST',
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (res.ok) {
      bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
      form.reset();
      loadCampaigns();
    } else {
      const errEl = document.getElementById('create-error');
      errEl.textContent = JSON.stringify(data);
      errEl.classList.remove('d-none');
    }
  }

  // 필터 버튼
  document.getElementById('status-filter').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-status]');
    if (!btn) return;
    document.querySelectorAll('#status-filter button').forEach(b => {
      b.className = b.className.replace('btn-dark', 'btn-outline-secondary').replace('active', '');
    });
    btn.classList.add('active');
    currentFilter = btn.dataset.status;
    loadCampaigns();
  });

  loadCampaigns();
</script>
{% endblock %}
