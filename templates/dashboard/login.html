<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 - Mini Ad Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .login-card { max-width: 420px; margin: 100px auto; }
    .brand { font-size: 1.8rem; font-weight: 700; color: #0d6efd; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="card shadow-sm">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div class="brand">📊 Mini Ad Manager</div>
        <p class="text-muted small">니트머스 광고 관리 플랫폼</p>
      </div>

      <div id="error-msg" class="alert alert-danger d-none"></div>

      <form id="login-form">
        <div class="mb-3">
          <label class="form-label">아이디</label>
          <input type="text" id="username" class="form-control" placeholder="advertiser01" required>
        </div>
        <div class="mb-4">
          <label class="form-label">비밀번호</label>
          <input type="password" id="password" class="form-control" placeholder="비밀번호" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
      </form>
    </div>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const res = await fetch('/api/v1/auth/token/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('access_token', data.access);
      localStorage.setItem('refresh_token', data.refresh);
      window.location.href = '/dashboard/';
    } else {
      const err = document.getElementById('error-msg');
      err.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
      err.classList.remove('d-none');
    }
  });

  // 이미 로그인된 경우 대시보드로
  if (localStorage.getItem('access_token')) {
    window.location.href = '/dashboard/';
  }
</script>
</body>
</html>
