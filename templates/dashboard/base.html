<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Mini Ad Manager{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { background: #f8f9fa; }
    .sidebar { min-height: 100vh; background: #212529; }
    .sidebar a { color: #adb5bd; text-decoration: none; }
    .sidebar a:hover, .sidebar a.active { color: #fff; }
    .stat-card { border-left: 4px solid; }
    .stat-card.primary { border-color: #0d6efd; }
    .stat-card.success { border-color: #198754; }
    .stat-card.warning { border-color: #ffc107; }
    .stat-card.info   { border-color: #0dcaf0; }
    .navbar-brand { font-weight: 700; color: #0d6efd !important; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <a class="navbar-brand" href="{% url 'dashboard' %}">📊 Mini Ad Manager</a>
  <div class="ms-auto d-flex align-items-center gap-3">
    <span class="text-light small" id="username-display"></span>
    <button class="btn btn-sm btn-outline-light" onclick="logout()">로그아웃</button>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 sidebar py-4 px-3">
      <ul class="nav flex-column gap-2">
        <li><a href="{% url 'dashboard' %}" class="nav-link px-2 {% block nav_dashboard %}{% endblock %}">🏠 대시보드</a></li>
        <li><a href="{% url 'campaign-list' %}" class="nav-link px-2 {% block nav_campaigns %}{% endblock %}">📋 캠페인</a></li>
        <li><a href="/api/docs/" target="_blank" class="nav-link px-2">📖 API 문서</a></li>
        <li><a href="/admin/" target="_blank" class="nav-link px-2">⚙️ Admin</a></li>
      </ul>
    </nav>

    <main class="col-md-10 py-4 px-4">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script>
  const API = '/api/v1';

  function getToken() { return localStorage.getItem('access_token'); }

  function authHeaders() {
    return { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' };
  }

  async function apiFetch(url, options = {}) {
    const res = await fetch(API + url, { headers: authHeaders(), ...options });
    if (res.status === 401) { window.location.href = "{% url 'login' %}"; return; }
    return res;
  }

  function logout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('refresh_token');
    window.location.href = "{% url 'login' %}";
  }

  // 로그인 상태 확인
  if (!getToken() && window.location.pathname !== "{% url 'login' %}") {
    window.location.href = "{% url 'login' %}";
  } else {
    const payload = getToken() ? JSON.parse(atob(getToken().split('.')[1])) : null;
    if (payload) document.getElementById('username-display').textContent = payload.sub || '';
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
